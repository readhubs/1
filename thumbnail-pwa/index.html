<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D4AF37">
  <meta name="description" content="مولّد صور الكورسات - جاهز لـ Udemy">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230A1628' width='32' height='32'/%3E%3Crect x='4' y='4' width='24' height='24' rx='2' fill='%23D4AF37'/%3E%3C/svg%3E">
  <title>مولّد الـ Thumbnail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0A0A14;
      color: #F5F5F0;
      min-height: 100vh;
      direction: rtl;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #0A1628 0%, #1A1A2E 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      border: 2px solid #D4AF37;
      position: relative;
    }

    .logo::before {
      content: '';
      position: absolute;
      width: 50px;
      height: 35px;
      background: linear-gradient(45deg, #D4AF37, #F5A623);
      border-radius: 4px;
    }

    .logo::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid #0A1628;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -30%);
    }

    h1 {
      font-size: 2.2em;
      color: #D4AF37;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .subtitle {
      color: #8899AA;
      font-size: 1.1em;
    }

    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 40px;
      padding: 40px 20px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .controls {
      background: rgba(20, 20, 30, 0.6);
      border-radius: 12px;
      padding: 25px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    .control-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #D4AF37;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 12px 15px;
      font-size: 15px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      background: #0A1628;
      color: #F5F5F0;
      cursor: pointer;
      font-family: inherit;
      direction: rtl;
    }

    select:focus {
      outline: none;
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    optgroup {
      background: #0A1628;
      color: #D4AF37;
      font-weight: 600;
    }

    option {
      background: #0A1628;
      color: #F5F5F0;
      padding: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #D4AF37 0%, #F5A623 100%);
      color: #0A1628;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: #D4AF37;
      border: 2px solid rgba(212, 175, 55, 0.5);
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: #D4AF37;
    }

    .btn-download {
      background: #2ECC71;
      color: #0A1628;
      display: none;
    }

    .btn-download.ready {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
      50% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
    }

    .btn-download:hover {
      background: #27AE60;
    }

    .niche-badge {
      display: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      color: #0A1628;
      margin-top: 15px;
      text-align: center;
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #050A14;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      color: #8899AA;
      font-size: 14px;
    }

    footer span {
      margin: 0 10px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"></div>
      <h1>مولّد صور الكورسات</h1>
      <p class="subtitle">1280 × 720 — جاهز لـ Udemy</p>
    </header>

    <main>
      <section class="controls">
        <div class="control-group">
          <label for="course-select">اختر الكورس</label>
          <select id="course-select">
            <option value="">-- اختر كورس --</option>
          </select>
        </div>

        <button id="generate-btn" class="btn btn-primary">
          توليد الصورة
        </button>

        <button id="regenerate-btn" class="btn btn-secondary">
          توليد مختلف
        </button>

        <div id="niche-badge" class="niche-badge"></div>
      </section>

      <section class="preview-area">
        <div class="canvas-wrapper">
          <canvas id="preview-canvas" width="1280" height="720"></canvas>
          <div id="loading-spinner" class="loading-spinner"></div>
        </div>

        <button id="download-btn" class="btn btn-download" style="margin-top: 20px; width: auto; padding: 12px 40px;">
          تحميل PNG
        </button>
      </section>
    </main>

    <footer>
      1280×720px <span>|</span> PNG <span>|</span> بدون نص <span>|</span> جاهز للرفع
    </footer>
  </div>

  <script src="js/courses.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/canvas-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
